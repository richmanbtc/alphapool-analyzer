services:
  app:
    build: .
    command: sleep infinity
    init: true
    volumes:
      - .:/workspace
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 2s
      timeout: 5s
      retries: 30
